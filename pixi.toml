[workspace]
name = "p8149-2026-vignettes"
version = "0.1.0"
description = "Reproducible R environment for the P8149 computational vignettes"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[dependencies]
python = ">=3.12,<3.13"
jupyter-book = "==2.1.6"
jupyterlab = ">=4.4,<5"
nbconvert = ">=7.16,<8"
ipywidgets = ">=8.1,<9"
r-base = "==4.5.3"
r-irkernel = ">=1.3,<2"

[tasks]
execute = "jupyter nbconvert --to notebook --execute --inplace --ExecutePreprocessor.timeout=300 --ExecutePreprocessor.kernel_name=ir P8149_Lecture_2_MAF_MLE_EM.ipynb P8149_Lecture_2_Li_Stephens_HMM.ipynb"
build = "jupyter book build --html"
serve = "jupyter book start"

